<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dossiers d'abos</title>
<style>
  :root { --bg:#fff; --fg:#0f0f0f; --muted:#606060; --chip:rgba(0,0,0,.05); --chip-h:rgba(0,0,0,.1); --line:rgba(0,0,0,.1);
    --act-bg:#0f0f0f; --act-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#212121; --fg:#f1f1f1; --muted:#aaa; --chip:rgba(255,255,255,.08); --chip-h:rgba(255,255,255,.16); --line:rgba(255,255,255,.14);
      --act-bg:#f1f1f1; --act-fg:#0f0f0f; }
  }
  * { box-sizing:border-box; }
  body { margin:0; width:300px; background:var(--bg); color:var(--fg); font:14px/1.4 "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  header img { width:28px; height:28px; }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  header p { margin:0; font-size:12px; color:var(--muted); }
  .list { padding:8px; max-height:340px; overflow:auto; }
  .f { width:100%; display:flex; align-items:center; gap:12px; height:40px; padding:0 12px; border:0; border-radius:10px;
    background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; }
  .f:hover { background:var(--chip); }
  .f .e { width:22px; text-align:center; font-size:17px; }
  .f .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .f .c { font-size:12px; color:var(--muted); }
  .f .d { width:8px; height:8px; border-radius:50%; }
  .empty { padding:18px 16px; color:var(--muted); text-align:center; font-size:13px; line-height:1.5; }
  footer { padding:8px 16px 16px; display:grid; gap:8px; }
  .btn { height:36px; border-radius:18px; border:0; font:500 14px inherit; font-family:inherit; cursor:pointer; background:var(--act-bg); color:var(--act-fg); }
  .btn.sec { background:var(--chip); color:var(--fg); }
  .btn:hover { filter:brightness(1.1); }
  .credit { padding:0 16px 14px; text-align:center; font-size:11px; color:var(--muted); }
  .credit a { color:inherit; }
  .btn.sec:hover { background:var(--chip-h); filter:none; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div><h1>Dossiers d'abos</h1><p id="sum">…</p></div>
  </header>
  <div class="list" id="list"></div>
  <footer>
    <button class="btn" id="manage">Gérer les dossiers</button>
    <button class="btn sec" id="subs">Ouvrir mes abonnements</button>
  </footer>
  <div class="credit">Vibe codée par <a href="https://github.com/RenzVASA/dossiers-abos-youtube" target="_blank">RenzVASA</a>, avec l'aide de Claude</div>
  <script src="popup.js"></script>
</body>
</html>
